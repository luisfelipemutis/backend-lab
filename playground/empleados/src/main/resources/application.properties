spring.application.name=empleados
# Conexion mysql
spring.datasource.url=jdbc:mysql://localhost:3306/empleados_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Para la creacion de la base de datos y tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Configuracion para jsp
spring.mvc.view.prefix=/WEB-INF/jsp/
# Con esta configuracion solo se toma en cuenta archivos con extension .jsp los demas se ignoran.
spring.mvc.view.suffix=.jsp
# Cambiar el context path de la aplicacion - Acceder localhost:8080/empleados
server.servlet.context-path=/empleados
# Cambiar el puerto de la aplicacion
# server.port=8080